name: deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: where to deploy
        type: choice
        options: [app-service, aks]
        default: app-service
      image:
        description: digest-pinned image ref (registry/name@sha256:...)
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reject tag-only refs
        env:
          IMG: ${{ inputs.image }}
        run: |
          case "$IMG" in
            *@sha256:*) echo "digest-pinned: $IMG" ;;
            *) echo "refusing to deploy a mutable tag: $IMG"; exit 1 ;;
          esac

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service (containers)
        if: inputs.target == 'app-service'
        run: ./ci/deploy-appservice.sh
        env:
          IMAGE_DIGEST_REF: ${{ inputs.image }}
          APP_SERVICE_NAME: ${{ vars.APP_SERVICE_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

      - name: Deploy to AKS (helm)
        if: inputs.target == 'aks'
        run: |
          az aks get-credentials -g "$AZURE_RESOURCE_GROUP" -n "$AKS_CLUSTER" --overwrite-existing
          ./ci/deploy-aks.sh
        env:
          IMAGE_DIGEST_REF: ${{ inputs.image }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AKS_CLUSTER: ${{ vars.AKS_CLUSTER }}
          HELM_VALUES_FILE: helm/orchardcore/values-prod.yaml
