name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap pinned upstream
        run: ./ci/bootstrap.sh

      - id: key
        run: echo "value=$(./ci/cache-key.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ steps.key.outputs.value }}
          restore-keys: nuget-${{ runner.os }}-

      - run: ./ci/restore.sh
      - run: ./ci/build.sh

      - name: Unit tests + Coverlet
        run: ./ci/test-unit.sh

      - run: ./ci/coverage-gate.sh

      - uses: codecov/codecov-action@v4
        if: ${{ hashFiles('.out/coverage/unit.cobertura.xml') != '' }}
        with:
          files: .out/coverage/unit.cobertura.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Coverage summary
        if: always()
        run: ./ci/coverage-report.sh >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            .out/tests/**
            .out/coverage/**

  integration:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ./ci/bootstrap.sh
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ needs.build-test.outputs.cache-key }}
      - run: ./ci/restore.sh
      - run: ./ci/build.sh
      - name: Integration tests (Testcontainers)
        run: ./ci/test-integration.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: .out/tests/integration/**

  sonar:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./ci/bootstrap.sh
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ needs.build-test.outputs.cache-key }}
      - uses: actions/download-artifact@v4
        with:
          name: test-results
          path: .out
      - run: ./ci/restore.sh
      - run: ./ci/sonar.sh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}

  package:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ./ci/bootstrap.sh
      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ needs.build-test.outputs.cache-key }}
      - run: ./ci/restore.sh
      - run: ./ci/publish.sh
        env:
          SELF_CONTAINED: ${{ vars.SELF_CONTAINED || 'false' }}

      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: ./ci/image.sh
        env:
          IMAGE_REF: orchardcore-cms:ci-${{ github.run_id }}
          SELF_CONTAINED: ${{ vars.SELF_CONTAINED || 'false' }}

      - uses: anchore/sbom-action/download-syft@v0
      - run: ./ci/sbom.sh
      - run: ./ci/scan-trivy.sh

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: .out/scan/trivy-image.sarif
          category: trivy-image

      - name: Black-box tests against the image
        run: ./ci/test-blackbox.sh
        env:
          IMAGE_REF: orchardcore-cms:ci-${{ github.run_id }}

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        if: github.ref == 'refs/heads/main'
        run: |
          ./ci/push.sh
          echo "digest=$(cut -d@ -f2 .out/image-digest.txt)" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          IMAGE_REF: orchardcore-cms:ci-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-and-scans
          path: |
            .out/sbom/**
            .out/scan/**

  owasp:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: ./ci/bootstrap.sh
      - uses: actions/cache@v4
        with:
          path: .cache/dependency-check
          key: dc-nvd-${{ github.run_id }}
          restore-keys: dc-nvd-
      - run: ./ci/scan-owasp.sh
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: .out/scan/dependency-check-report.*
