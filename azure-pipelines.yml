trigger:
  branches:
    include: [main]

variables:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages

pool:
  vmImage: ubuntu-latest

stages:
  - stage: build
    jobs:
      - job: build_test
        timeoutInMinutes: 60
        steps:
          - task: UseDotNet@2
            inputs:
              version: 10.0.x

          - script: ./ci/bootstrap.sh
            displayName: Bootstrap pinned upstream

          - script: echo "##vso[task.setvariable variable=nugetKey]$(./ci/cache-key.sh)"
            displayName: Compute restore cache key

          # Azure DevOps Cache@2 restores only on an exact key hit; restoreKeys are the
          # prefix fallback. NUGET_PACKAGES must point outside the sources dir or the
          # cache task and `dotnet restore` fight over the same tree.
          - task: Cache@2
            inputs:
              key: 'nuget | "$(Agent.OS)" | $(nugetKey)'
              restoreKeys: |
                nuget | "$(Agent.OS)"
              path: $(NUGET_PACKAGES)
              cacheHitVar: NUGET_CACHE_HIT
            displayName: Cache NuGet packages

          - script: ./ci/restore.sh
            displayName: dotnet restore
            env:
              ARTIFACTORY_URL: $(ARTIFACTORY_URL)
              ARTIFACTORY_NUGET_REPO: $(ARTIFACTORY_NUGET_REPO)
              ARTIFACTORY_USER: $(ARTIFACTORY_USER)
              ARTIFACTORY_TOKEN: $(ARTIFACTORY_TOKEN)

          - script: ./ci/build.sh
            displayName: dotnet build -c Release

          - script: ./ci/test-unit.sh
            displayName: Unit tests + Coverlet

          - script: ./ci/coverage-gate.sh
            displayName: Coverage gate

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '.out/tests/**/*.trx'

          - task: PublishCodeCoverageResults@2
            condition: always()
            inputs:
              summaryFileLocation: '.out/coverage/unit.cobertura.xml'

  - stage: package
    dependsOn: build
    jobs:
      - job: image
        timeoutInMinutes: 45
        steps:
          - task: UseDotNet@2
            inputs:
              version: 10.0.x
          - script: ./ci/bootstrap.sh
          - task: Cache@2
            inputs:
              key: 'nuget | "$(Agent.OS)" | $(nugetKey)'
              restoreKeys: 'nuget | "$(Agent.OS)"'
              path: $(NUGET_PACKAGES)
          - script: ./ci/restore.sh
          - script: ./ci/publish.sh
            displayName: dotnet publish
          - script: ./ci/image.sh
            displayName: docker build
            env:
              IMAGE_REF: orchardcore-cms:$(Build.BuildId)
          - script: ./ci/sbom.sh
            displayName: SBOM
          - script: ./ci/scan-trivy.sh
            displayName: Trivy
          - task: Docker@2
            displayName: Push to ACR
            inputs:
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              repository: orchardcore-cms
              command: push
              tags: $(Build.BuildId)

  - stage: deploy
    dependsOn: package
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: app_service
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureWebAppContainer@1
                  displayName: Azure App Service (container)
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    appName: $(APP_SERVICE_NAME)
                    containers: $(ACR_LOGIN_SERVER)/orchardcore-cms:$(Build.BuildId)
                    appSettings: -WEBSITES_PORT 8080 -ASPNETCORE_URLS http://+:8080

      - deployment: aks
        dependsOn: app_service
        environment: production-aks
        condition: eq(variables['DEPLOY_AKS'], 'true')
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: HelmDeploy@0
                  inputs:
                    connectionType: Azure Resource Manager
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    azureResourceGroup: $(AZURE_RESOURCE_GROUP)
                    kubernetesCluster: $(AKS_CLUSTER)
                    namespace: cms
                    command: upgrade
                    chartType: FilePath
                    chartPath: helm/orchardcore
                    releaseName: cms
                    valueFile: helm/orchardcore/values-prod.yaml
                    arguments: --install --wait --timeout 10m --set image.repository=$(ACR_LOGIN_SERVER)/orchardcore-cms --set image.tag=$(Build.BuildId)
